<div id="ht-video-wall">
  <div id="ht-status" style="text-align:center;padding:20px;font-family:sans-serif;color:#666;">
    Videolar yükleniyor...
  </div>
  <div id="ht-grid" style="
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
      gap:16px;
      margin-top:16px;
  "></div>
  <div id="ht-updated" style="text-align:center;font-size:12px;color:#999;margin-top:12px;font-family:sans-serif;"></div>
</div>

<script>
(function () {
  // ================== AYARLAR ==================
  var API_KEY = "AIzaSyAeg4ChgpXnWvxIP9ZVhwbvSLRhqrolnYs"; // <-- kendi API anahtarınızı buraya yazın

  var HASHTAGS = [
    "#pimple", "#pimples", "#popping", "#pimplepopping",
    "#blackhead", "#blackheads", "#blackheadsremoval", "#blackheadremoval",
    "#acne", "#zit", "#zits"
  ];
  var SEARCH_QUERY = HASHTAGS.join("|");

  var MAX_RESULTS = 50;
  var REFRESH_MS = 60 * 60 * 1000; // 1 saat
  var CACHE_KEY = "ht_video_cache_v1";
  var CACHE_TIME_KEY = "ht_video_cache_time_v1";
  // ================================================

  var statusEl = document.getElementById("ht-status");
  var gridEl = document.getElementById("ht-grid");
  var updatedEl = document.getElementById("ht-updated");

  function renderVideos(items) {
    gridEl.innerHTML = "";
    if (!items || items.length === 0) {
      statusEl.textContent = "Şu an gösterilecek video bulunamadı.";
      statusEl.style.display = "block";
      return;
    }
    statusEl.style.display = "none";
    items.forEach(function (item) {
      var videoId = item.id && item.id.videoId;
      if (!videoId) return;
      var wrapper = document.createElement("div");
      wrapper.style.position = "relative";
      wrapper.style.paddingBottom = "56.25%";
      wrapper.style.height = "0";
      wrapper.style.overflow = "hidden";
      wrapper.style.borderRadius = "8px";
      wrapper.style.boxShadow = "0 1px 4px rgba(0,0,0,0.15)";

      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube.com/embed/" + videoId;
      iframe.style.position = "absolute";
      iframe.style.top = "0";
      iframe.style.left = "0";
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("allowfullscreen", "true");
      iframe.setAttribute("loading", "lazy");
      iframe.setAttribute(
        "allow",
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      );

      wrapper.appendChild(iframe);
      gridEl.appendChild(wrapper);
    });
  }

  function setUpdatedText(date) {
    updatedEl.textContent = "Son güncelleme: " + date.toLocaleString("tr-TR");
  }

  function saveCache(items) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(items));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
    } catch (e) {}
  }

  function loadCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      var time = localStorage.getItem(CACHE_TIME_KEY);
      if (!raw || !time) return null;
      return { items: JSON.parse(raw), time: parseInt(time, 10) };
    } catch (e) {
      return null;
    }
  }

  function fetchVideos() {
    if (!API_KEY || API_KEY === "YOUR_YOUTUBE_API_KEY_HERE") {
      statusEl.textContent = "Hata: Lütfen kod içine geçerli bir YouTube API anahtarı girin.";
      return;
    }

    var url =
      "https://www.googleapis.com/youtube/v3/search" +
      "?part=snippet" +
      "&type=video" +
      "&order=date" +
      "&maxResults=" + MAX_RESULTS +
      "&q=" + encodeURIComponent(SEARCH_QUERY) +
      "&key=" + API_KEY;

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error("YouTube API hatası: " + res.status);
        return res.json();
      })
      .then(function (data) {
        var items = data.items || [];
        renderVideos(items);
        saveCache(items);
        setUpdatedText(new Date());
      })
      .catch(function (err) {
        console.error(err);
        var cached = loadCache();
        if (cached) {
          renderVideos(cached.items);
          setUpdatedText(new Date(cached.time));
          statusEl.textContent = "Not: Güncel veri alınamadı, önbellekteki son sonuçlar gösteriliyor.";
          statusEl.style.display = "block";
        } else {
          statusEl.textContent = "Videolar yüklenirken bir hata oluştu.";
          statusEl.style.display = "block";
        }
      });
  }

  function init() {
    var cached = loadCache();
    var oneHourAgo = Date.now() - REFRESH_MS;

    if (cached && cached.time > oneHourAgo) {
      renderVideos(cached.items);
      setUpdatedText(new Date(cached.time));
    } else {
      fetchVideos();
    }

    setInterval(fetchVideos, REFRESH_MS);
  }

  init();
})();
</script>
